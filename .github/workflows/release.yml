name: Publish Release

on:
  push:
    tags:
      - 'RAZER_FA2SP*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore .

      - name: Build Release
        run: msbuild /m /p:Configuration=Release /p:Platform=x86 .

      - name: Compute release metadata
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "Tag name could not be resolved."
          }

          $safeTag = ($tag -replace '[^A-Za-z0-9._-]', '_')
          $prefix = 'RAZER_FA2SP'
          if ($tag.StartsWith($prefix)) {
            $suffix = $tag.Substring($prefix.Length).TrimStart('_', '-')
            if ([string]::IsNullOrWhiteSpace($suffix)) {
              $releaseName = 'RAZER FA2SP'
            } else {
              $releaseName = "RAZER FA2SP $suffix"
            }
          } else {
            $releaseName = "FA2sp $tag"
          }

          $archiveStem = "FA2SP_$safeTag"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "safe_tag=$safeTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_stem=$archiveStem" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare distributable archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveStem = "${{ steps.metadata.outputs.archive_stem }}"
          $packageRoot = Join-Path -Path 'dist' -ChildPath $archiveStem

          Remove-Item -Path $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          if (-not (Test-Path 'Release/FA2sp.dll')) {
            throw "Expected binary Release/FA2sp.dll was not produced."
          }

          $binDir = Join-Path $packageRoot 'bin'
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          $releaseDlls = Get-ChildItem -Path 'Release' -Filter '*.dll'
          if ($releaseDlls.Count -eq 0) {
            throw "No DLLs were produced in Release build."
          }
          $releaseDlls | Copy-Item -Destination $binDir -Force

          if (Test-Path 'Supplementary') {
            Copy-Item -Path 'Supplementary' -Destination (Join-Path $packageRoot 'Supplementary') -Recurse -Force
          }

          $archiveDir = 'dist'
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null
          $archivePath = Join-Path $archiveDir "${archiveStem}.7z"
          if (Test-Path $archivePath) { Remove-Item $archivePath -Force }

          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (Test-Path $sevenZip) {
            & $sevenZip a -t7z $archivePath "$packageRoot\*" | Out-Null
          } else {
            $fallback = [System.IO.Path]::ChangeExtension($archivePath, '.zip')
            if (Test-Path $fallback) { Remove-Item $fallback -Force }
            Compress-Archive -Path "$packageRoot\*" -DestinationPath $fallback
            $archivePath = $fallback
          }

          $normalized = (Resolve-Path $archivePath).Path.Replace('\\','/')
          "archive_path=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.release_name }}
          generate_release_notes: true
          files: |
            Release/FA2sp.dll
            Release/FA2sp.pdb
            ${{ steps.package.outputs.archive_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
